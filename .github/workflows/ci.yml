name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloads Godot + the Web template (scripts/godot.mjs), then runs tests/test_logic.gd.
      - run: npm test
      # Same build Workers Builds runs before deploying.
      - run: npm run build
