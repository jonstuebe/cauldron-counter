<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cauldron Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=IM+Fell+English:ital@0;1&display=block" rel="stylesheet">
<style>
  :root{
    --bg:#1e1830; --bg2:#2a2142; --ink:#efe7d6; --muted:#a99fbd; --panel:#2f2749;
    --brass:#d4ad55; --brass-hi:#f0cb73; --iron:#120e1a; --iron-hi:#2c2538;
    --glow:#6fe0bd; --wood:#4f3624; --wood-hi:#6d4c33;
    --glass:rgba(255,255,255,.12); --glass-edge:rgba(239,231,214,.3);
    --plate-ink:#1e1830;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;color:var(--ink);font-family:"Alegreya Sans",sans-serif;
    background:
      radial-gradient(ellipse 420px 330px at 330px 360px, rgba(240,160,80,.30), transparent 70%),
      radial-gradient(ellipse 300px 220px at 330px 250px, rgba(111,224,189,.16), transparent 70%),
      radial-gradient(ellipse 900px 500px at 900px 0px, #2a2142, transparent 75%),
      linear-gradient(180deg,#191329 0%,#1e1830 55%,#17122a 100%);
  }
  .sky{position:absolute;inset:0}
  .cauldron{position:absolute;left:60px;top:96px;width:540px;height:478px}
  .cauldron svg{width:100%;height:100%;overflow:visible}
  .title{position:absolute;left:600px;top:118px;width:520px}
  .kicker{font:700 22px "Alegreya Sans";letter-spacing:.32em;text-transform:uppercase;color:var(--brass);display:flex;align-items:center;gap:14px;margin-left:6px}
  .kicker::after{content:"";height:2px;width:88px;background:linear-gradient(90deg,var(--brass),transparent)}
  h1{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:132px;line-height:.9;margin-top:18px;letter-spacing:-.5px;
     color:var(--ink);text-shadow:0 0 40px rgba(240,160,80,.25),0 3px 0 rgba(0,0,0,.35)}
  h1 span{display:block}
  h1 span+span{padding-left:46px}
  .tag{margin-top:26px;font:500 34px/1.25 "Alegreya Sans";color:var(--muted);max-width:470px;margin-left:6px}
  .tag b{color:var(--glow);font-weight:800}
  .shelf{position:absolute;right:0;bottom:22px;width:560px;height:150px;overflow:visible}
</style>
</head>
<body>
  <!-- night sky: stars + crescent -->
  <svg class="sky" viewBox="0 0 1200 630" aria-hidden="true">
    <g fill="#efe7d6">
      <circle cx="96" cy="70" r="1.6" opacity=".7"/><circle cx="210" cy="40" r="1.2" opacity=".5"/>
      <circle cx="430" cy="58" r="1.8" opacity=".6"/><circle cx="540" cy="30" r="1.1" opacity=".5"/>
      <circle cx="660" cy="66" r="1.4" opacity=".55"/><circle cx="760" cy="34" r="1" opacity=".45"/>
      <circle cx="1010" cy="92" r="1.3" opacity=".5"/><circle cx="1140" cy="60" r="1.7" opacity=".6"/>
      <circle cx="1160" cy="200" r="1.1" opacity=".4"/><circle cx="40" cy="220" r="1.2" opacity=".4"/>
      <circle cx="570" cy="140" r="1" opacity=".35"/>
      <path d="M318 44 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".8"/>
      <path d="M880 48 l1.6 5 5 1.6 -5 1.6 -1.6 5 -1.6 -5 -5 -1.6 5 -1.6z" opacity=".7"/>
    </g>
    <path d="M1078 34a30 30 0 1 0 20 50 26 26 0 0 1-20-50z" fill="#f0cb73" opacity=".9"/>
  </svg>

  <!-- the game's cauldron, scaled up, with a lit brew -->
  <div class="cauldron">
    <svg viewBox="0 0 260 230" aria-hidden="true">
      <defs>
        <radialGradient id="brew" cx="50%" cy="45%" r="60%">
          <stop offset="0" stop-color="#c8ffe9"/>
          <stop offset=".45" stop-color="#6fe0bd"/>
          <stop offset="1" stop-color="#2f9e7e"/>
        </radialGradient>
        <radialGradient id="steam" cx="50%" cy="100%" r="80%">
          <stop offset="0" stop-color="#6fe0bd" stop-opacity=".5"/>
          <stop offset="1" stop-color="#6fe0bd" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
        <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f0cb73"/><stop offset="1" stop-color="#c79a3e"/>
        </linearGradient>
      </defs>

      <!-- teal light column + vapour -->
      <ellipse cx="130" cy="40" rx="78" ry="56" fill="url(#steam)" filter="url(#soft)"/>
      <g fill="#bff5e2" filter="url(#blur2)">
        <circle cx="104" cy="56" r="7" opacity=".55"/><circle cx="134" cy="44" r="10" opacity=".45"/>
        <circle cx="158" cy="58" r="6" opacity=".5"/><circle cx="118" cy="24" r="8" opacity=".3"/>
        <circle cx="150" cy="16" r="6" opacity=".22"/><circle cx="128" cy="-4" r="9" opacity=".14"/>
        <circle cx="96" cy="2" r="5" opacity=".14"/>
      </g>

      <!-- fire glow + flames -->
      <ellipse cx="130" cy="214" rx="70" ry="16" fill="#f08a4b" opacity=".5" filter="url(#soft)"/>
      <g>
        <path d="M98 222 C88 206 96 196 104 186 C104 198 112 200 112 210 C112 218 106 222 98 222Z" fill="#f08a4b"/>
        <path d="M130 224 C116 206 126 188 132 176 C134 192 146 198 144 212 C142 220 138 224 130 224Z" fill="#f6b24c"/>
        <path d="M160 222 C152 210 158 200 164 192 C166 202 172 206 170 214 C168 220 164 222 160 222Z" fill="#e0614f"/>
        <path d="M131 222 C125 212 129 204 132 198 C134 206 139 210 137 216 C136 220 134 222 131 222Z" fill="#ffe6a0"/>
      </g>
      <path d="M78 226 L182 226" stroke="#4f3624" stroke-width="7" stroke-linecap="round"/>

      <!-- iron body (game paths) -->
      <path d="M64 176 L52 210 M196 176 L208 210" stroke="#2c2538" stroke-width="9" stroke-linecap="round"/>
      <circle cx="26" cy="96" r="12" fill="none" stroke="#2c2538" stroke-width="6"/>
      <circle cx="234" cy="96" r="12" fill="none" stroke="#2c2538" stroke-width="6"/>
      <path d="M30 76 Q24 176 130 192 Q236 176 230 76 Z" fill="#120e1a"/>
      <!-- warm firelight on the underside -->
      <path d="M58 160 Q130 204 202 160 Q170 188 130 192 Q90 188 58 160Z" fill="#f08a4b" opacity=".28"/>
      <path d="M46 96 Q44 150 84 172" stroke="#3a3148" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>
      <path d="M214 98 Q216 140 192 164" stroke="#6fe0bd" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".25"/>
      <ellipse cx="130" cy="76" rx="106" ry="20" fill="#2c2538"/>
      <ellipse cx="130" cy="78" rx="94" ry="13" fill="#6fe0bd" filter="url(#soft)" opacity=".8"/>
      <ellipse cx="130" cy="78" rx="94" ry="13" fill="url(#brew)"/>
      <ellipse cx="112" cy="76" rx="30" ry="4" fill="#e8fff6" opacity=".55"/>
      <g fill="#f0cb73">
        <circle cx="92" cy="66" r="2.5"/><circle cx="118" cy="60" r="2"/>
        <circle cx="146" cy="64" r="3"/><circle cx="170" cy="62" r="2"/><circle cx="160" cy="48" r="1.6" opacity=".7"/>
      </g>

      <!-- brass strength plate -->
      <rect x="88" y="110" width="84" height="54" rx="12" fill="#000" opacity=".35"/>
      <rect x="88" y="106" width="84" height="54" rx="12" fill="url(#plate)"/>
      <rect x="91" y="109" width="78" height="48" rx="9.5" fill="none" stroke="#fff3cf" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="95" cy="113" r="1.6" fill="#8a6a28"/><circle cx="165" cy="113" r="1.6" fill="#8a6a28"/>
      <circle cx="95" cy="153" r="1.6" fill="#8a6a28"/><circle cx="165" cy="153" r="1.6" fill="#8a6a28"/>
      <text x="130" y="121" text-anchor="middle" style="font:700 10px 'Alegreya Sans';letter-spacing:1.5px;fill:#1e1830;opacity:.75">STRENGTH</text>
      <text x="130" y="152" text-anchor="middle" style="font:800 34px 'Alegreya Sans';fill:#1e1830">42</text>
    </svg>
  </div>

  <div class="title">
    <div class="kicker">A potion stall</div>
    <h1><span>Cauldron</span><span>Counter</span></h1>
    <p class="tag">Brew potions of an <b>exact strength</b>, with the fewest ingredients.</p>
  </div>

  <!-- shelf edge with jars (game jar shape) -->
  <svg class="shelf" viewBox="0 0 560 150" aria-hidden="true">
    <defs>
      <clipPath id="jb"><path d="M20 12h20v6c10 4 14 12 14 22 0 18-10 30-24 30S6 58 6 40c0-10 4-18 14-22z"/></clipPath>
      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d4c33"/><stop offset="1" stop-color="#3a2618"/></linearGradient>
    </defs>
    <rect x="40" y="118" width="540" height="14" rx="4" fill="url(#wood)"/>
    <rect x="42" y="118" width="538" height="2.5" rx="1" fill="#9a7350" opacity=".7"/>
    <rect x="24" y="132" width="540" height="10" fill="#140f20" opacity=".55"/>
    <path d="M120 132 v34 M120 132 q0 26 -26 34" stroke="#2c2538" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Moonwater -->
    <g transform="translate(290,48) scale(.98)">
      <ellipse cx="30" cy="72" rx="22" ry="4" fill="#000" opacity=".35"/>
      <rect x="21" y="2" width="18" height="10" rx="2.5" fill="#8a6440"/>
      <path d="M20 12h20v6c10 4 14 12 14 22 0 18-10 30-24 30S6 58 6 40c0-10 4-18 14-22z" fill="rgba(255,255,255,.12)"/>
      <rect x="0" y="30" width="60" height="46" fill="#cfc8ff" clip-path="url(#jb)"/>
      <path d="M20 12h20v6c10 4 14 12 14 22 0 18-10 30-24 30S6 58 6 40c0-10 4-18 14-22z" fill="none" stroke="rgba(239,231,214,.3)" stroke-width="1.5"/>
      <path d="M13 31c-3 5-3 14 0 20" stroke="rgba(255,255,255,.55)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <g transform="translate(19,38) scale(.95)" fill="rgba(30,22,40,.6)"><path d="M15 3a9 9 0 1 0 6 15 8 8 0 0 1-6-15z"/></g>
    </g>
    <!-- Dragon pepper -->
    <g transform="translate(372,38) scale(1.12)">
      <ellipse cx="30" cy="72" rx="22" ry="4" fill="#000" opacity=".35"/>
      <rect x="21" y="2" width="18" height="10" rx="2.5" fill="#8a6440"/>
      <path d="M20 12h20v6c10 4 14 12 14 22 0 18-10 30-24 30S6 58 6 40c0-10 4-18 14-22z" fill="rgba(255,255,255,.12)"/>
      <rect x="0" y="26" width="60" height="50" fill="#e2504a" clip-path="url(#jb)"/>
      <path d="M20 12h20v6c10 4 14 12 14 22 0 18-10 30-24 30S6 58 6 40c0-10 4-18 14-22z" fill="none" stroke="rgba(239,231,214,.3)" stroke-width="1.5"/>
      <path d="M13 31c-3 5-3 14 0 20" stroke="rgba(255,255,255,.55)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <g transform="translate(19,38) scale(.95)" fill="rgba(30,22,40,.6)" color="rgba(30,22,40,.6)"><path d="M7 8c4-2 11 0 12 5 1 6-7 10-14 8 5-2 7-6 5-10-1-1-2-2-3-3z"/><path d="M8 8c0-2 1-4 4-5" stroke-width="2" fill="none" stroke="currentColor"/></g>
    </g>
    <!-- Dewdrop -->
    <g transform="translate(456,56) scale(.86)">
      <ellipse cx="30" cy="72" rx="22" ry="4" fill="#000" opacity=".35"/>
      <rect x="21" y="2" width="18" height="10" rx="2.5" fill="#8a6440"/>
      <path d="M20 12h20v6c10 4 14 12 14 22 0 18-10 30-24 30S6 58 6 40c0-10 4-18 14-22z" fill="rgba(255,255,255,.12)"/>
      <rect x="0" y="34" width="60" height="42" fill="#7fc8e8" clip-path="url(#jb)"/>
      <path d="M20 12h20v6c10 4 14 12 14 22 0 18-10 30-24 30S6 58 6 40c0-10 4-18 14-22z" fill="none" stroke="rgba(239,231,214,.3)" stroke-width="1.5"/>
      <path d="M13 31c-3 5-3 14 0 20" stroke="rgba(255,255,255,.55)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <g transform="translate(19,38) scale(.95)" fill="rgba(30,22,40,.6)"><path d="M12 3C12 3 6 10 6 14a6 6 0 0 0 12 0C18 10 12 3 12 3Z"/></g>
    </g>
  </svg>
</body>
</html>
